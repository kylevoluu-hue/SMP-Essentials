name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests clean package

      - name: Package resource pack
        run: |
          cd resourcepack
          zip -r ../SMPEssentials-ResourcePack.zip . -x '*.md'
          cd ..
          echo "PACK_SHA1=$(sha1sum SMPEssentials-ResourcePack.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMPEssentials
          path: |
            target/SMPEssentials.jar
            SMPEssentials-ResourcePack.zip
          if-no-files-found: error

      # Publish the jar + resource pack to a rolling "latest" GitHub Release for a
      # clean, one-click download (no login required to grab a release asset).
      - name: Publish to "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically built artifacts (Paper 26.1.2, Java 25):
            - SMPEssentials.jar — the plugin
            - SMPEssentials-ResourcePack.zip — custom item textures (optional; Java client)

            Resource-pack URL:
            https://github.com/kylevoluu-hue/SMP-Essentials/releases/download/latest/SMPEssentials-ResourcePack.zip
            Resource-pack SHA-1: ${{ env.PACK_SHA1 }}
          files: |
            target/SMPEssentials.jar
            SMPEssentials-ResourcePack.zip
